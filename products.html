<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Auspicious Craft | Resin Nativity Sets & Christmas Crafts</title>
  <meta name="description" content="Browse Auspicious Craft's full catalogue of resin nativity sets, hand-painted statues, miniature churches and holiday decor. Filter by material, size and set size.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Ccircle cx='22' cy='22' r='21' fill='%237C1D2E'/%3E%3Cpath d='M22 7 l2.6 6.4 6.4 1 -4.4 4.2 1 6.4 -5.6 -3.2 -5.6 3.2 1 -6.4 -4.4 -4.2 6.4 -1 Z' fill='%23E4C877'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            burgundy: { DEFAULT:'#7C1D2E', 50:'#faf0f2', 100:'#f4dde1', 200:'#e7b8c0', 300:'#d48a99', 400:'#bd5c70', 500:'#a03a52', 600:'#8a2b42', 700:'#7C1D2E', 800:'#5e1726', 900:'#451221' },
            pine: { DEFAULT:'#1E4A3C', 50:'#eef4f1', 100:'#d6e6de', 200:'#adcdbf', 300:'#7fb29c', 400:'#57947c', 500:'#3b7762', 600:'#2c5f4d', 700:'#1E4A3C', 800:'#16372d', 900:'#0f2620' },
            gold: { DEFAULT:'#F5B800', 50:'#faf6ec', 100:'#f3ead2', 200:'#ffe27a', 300:'#ffd45c', 400:'#ffc926', 500:'#F5B800', 600:'#d4a000', 700:'#b8860b', 800:'#8a6700', 900:'#6b4f00', light:'#F5B800' },
            wood: { DEFAULT:'#8B5E3C', 50:'#f7f1ea', 100:'#ecdfcf', 200:'#d8bfa0', 300:'#c19c72', 400:'#a87f53', 500:'#8B5E3C', 600:'#704a30', 700:'#573a26', 800:'#3f2a1c', 900:'#2b1c13' },
            cream: { DEFAULT:'#FAF6EF', 50:'#FDFBF7', 100:'#FAF6EF', 200:'#F3ECDD', 300:'#E9DFC8', soft:'#F3ECDD' },
            night: { DEFAULT:'#211915', 50:'#f5f1ee', 700:'#3a2c25', 900:'#211915' }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="products" class="antialiased">

  <header id="site-header"></header>

  <main>
    <!-- Page banner -->
    <section class="relative overflow-hidden bg-burgundy text-cream">
      <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 15% 30%, #E4C877 0 2px, transparent 2.5px); background-size: 26px 26px;"></div>
      <div class="container-x relative py-16 text-center">
        <p class="text-xs uppercase tracking-[0.24em] text-gold-light font-bold" data-i18n="products.banner">Catalogue</p>
        <h1 class="font-display text-3xl sm:text-5xl font-bold mt-2" data-i18n="products.bannerTitle">Product Range</h1>
        <p class="mt-3 text-[#f0e0d5] max-w-xl mx-auto" data-i18n="products.bannerSub">Search, filter and shortlist our resin nativity sets, statues, churches and decor.</p>
      </div>
    </section>

    <section class="container-x py-12">
      <!-- Live search -->
      <div class="relative max-w-2xl mx-auto">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#b3a68f]">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </span>
        <input id="searchInput" type="search" placeholder="Search by name, model, material…" data-i18n-placeholder="products.search" class="field pl-12 py-4 rounded-full shadow-sm">
      </div>

      <!-- Category tabs -->
      <div id="categoryTabs" class="flex flex-wrap justify-center gap-3 mt-8"></div>

      <!-- Filters -->
      <div class="mt-8 space-y-5">
        <div class="bg-white border border-[#eadfc9] rounded-2xl p-5">
          <p class="field-label mb-2" data-i18n="products.material">Material</p>
          <div id="materialChips" class="flex flex-wrap gap-2"></div>
        </div>
        <div class="bg-white border border-[#eadfc9] rounded-2xl p-5">
          <p class="field-label mb-2" data-i18n="products.size">Size</p>
          <div id="sizeChips" class="flex flex-wrap gap-2"></div>
        </div>
        <div class="bg-white border border-[#eadfc9] rounded-2xl p-5">
          <p class="field-label mb-2" data-i18n="products.setSize">Set Size (figures)</p>
          <div id="piecesChips" class="flex flex-wrap gap-2"></div>
        </div>
      </div>

      <p id="resultCount" class="mt-8 text-sm font-semibold text-[#6b5c4a]"></p>

      <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mt-4"></div>

      <div id="emptyState" class="hidden text-center py-20">
        <p class="font-display text-2xl font-bold text-night" data-i18n="products.empty">No products match your filters</p>
        <p class="text-[#6b5c4a] mt-2" data-i18n="products.emptyHint">Try clearing a filter or search term.</p>
        <button id="clearFilters" class="btn-gold px-6 py-3 text-sm mt-6" data-i18n="products.clear">Clear all filters</button>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products.js"></script>
  <script>
    document.getElementById('clearFilters').addEventListener('click', function () {
      filterState.q = ''; filterState.category = 'all'; filterState.material = 'all';
      filterState.size = 'all'; filterState.pieces = 'all';
      var s = document.getElementById('searchInput'); if (s) s.value = '';
      render();
    });
  </script>
</body>
</html>
